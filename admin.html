<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Admin — Hadessei Portfolio</title><link rel="stylesheet" href="admin.css">
</head>
<body>
<div class="admin-wrap">
  <header><a href="index.html">← VER PORTAFOLIO</a><h1>ADMIN PANEL</h1><span>Editor local</span></header>
  <div class="notice">Los cambios de este panel se guardan en este navegador. Para que todos los visitantes vean los cambios necesitas conectar una base de datos/backend.</div>

  <section class="panel">
    <h2>Información principal</h2>
    <div class="grid">
      <label>Nombre<input id="name"></label>
      <label>Etiqueta<input id="eyebrow"></label>
      <label>Avatar / skin URL<input id="avatar"></label>
    </div>
    <label>Descripción<textarea id="description"></textarea></label>
  </section>

  <section class="panel">
    <h2>Perfil</h2>
    <div class="grid"><label>Título<input id="aboutTitle"></label><label>Texto<textarea id="aboutText"></textarea></label></div>
    <label>Enfoques (uno por línea)<textarea id="focus"></textarea></label>
  </section>

  <section class="panel">
    <h2>Contacto</h2>
    <div class="grid"><label>Discord<input id="discord"></label><label>Email<input id="email"></label></div>
  </section>

  <section class="panel">
    <h2>Estadísticas</h2><div id="statsEditor"></div>
  </section>

  <section class="panel">
    <h2>Servidores / experiencia</h2><div id="serversEditor"></div>
  </section>

  <section class="panel">
    <h2>Habilidades</h2><div id="skillsEditor"></div>
  </section>

  <div class="actions"><button id="save">GUARDAR CAMBIOS</button><button id="reset" class="danger">RESTAURAR CONFIGURACIÓN</button></div>
  <p id="result"></p>
</div>
<script src="config.js"></script><script src="admin.js"></script>
</body>
</html>
