<div id="dc-card" style="width:340px;background:#111a32;border:1px solid #6bb6ff66;border-radius:18px;padding:16px;font-family:monospace;color:white">
  <div style="display:flex;align-items:center;gap:10px">
    <img id="dc-avatar" style="width:40px;height:40px;border-radius:50%" src="">
    <div>
      <div id="dc-name" style="font-weight:800">Cargando...</div>
      <div id="dc-status" style="font-size:12px;color:#94a3b8">Conectando...</div>
    </div>
    <div id="dc-dot" style="margin-left:auto;width:10px;height:10px;border-radius:50%;background:grey"></div>
  </div>
  
  <div id="dc-spotify" style="display:none;margin-top:14px;background:#00050;padding:10px;border-radius:12px;align-items:center;gap:10px">
    <img id="sp-img" style="width:48px;height:48px;border-radius:8px" src="">
    <div style="overflow:hidden">
      <div id="sp-song" style="font-weight:800;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">-</div>
      <div id="sp-artist" style="font-size:11px;color:#94a3b8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">-</div>
      <div id="sp-bar" style="height:3px;background:#ffffff22;border-radius:10px;margin-top:6px"><div id="sp-progress" style="height:100%;background:#1DB954;width:0%"></div></div>
    </div>
  </div>
</div>

<script>
const ID = "1484659327716294657";
async function update(){
  try{
    const res = await fetch(`https://api.lanyard.rest/v1/users/${ID}`);
    const json = await res.json();
    if(!json.success){ 
      document.getElementById('dc-status').innerText = "❌ Únete a discord.gg/lanyard";
      return;
    }
    const d = json.data;
    const avatar = d.discord_user.avatar ? `https://cdn.discordapp.com/avatars/${ID}/${d.discord_user.avatar}.png` : `https://cdn.discordapp.com/embed/avatars/0.png`;
    document.getElementById('dc-avatar').src = avatar;
    document.getElementById('dc-name').innerText = d.discord_user.global_name || d.discord_user.username;
    
    const colors = {online:"#23a559", idle:"#f0b232", dnd:"#f23f43", offline:"#80848e"};
    document.getElementById('dc-dot').style.background = colors[d.discord_status] || "#80848e";
    document.getElementById('dc-status').innerText = d.discord_status.toUpperCase() + (d.listening_to_spotify ? " • ESCUCHANDO SPOTIFY" : "");

    if(d.listening_to_spotify){
      document.getElementById('dc-spotify').style.display = "flex";
      document.getElementById('sp-song').innerText = d.spotify.song;
      document.getElementById('sp-artist').innerText = d.spotify.artist;
      document.getElementById('sp-img').src = d.spotify.album_art_url;
      // barra de progreso real
      const total = d.spotify.timestamps.end - d.spotify.timestamps.start;
      const current = Date.now() - d.spotify.timestamps.start;
      const pct = Math.min(100, (current/total)*100);
      document.getElementById('sp-progress').style.width = pct + "%";
    } else {
      document.getElementById('dc-spotify').style.display = "none";
    }
  }catch(e){
    document.getElementById('dc-status').innerText = "Error de conexión";
  }
}
update();
setInterval(update, 1000); // actualiza la barra cada segundo
</script>
